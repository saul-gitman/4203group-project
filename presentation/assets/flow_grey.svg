<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2350 875" width="2350" height="875" font-family="Arial, Liberation Sans, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7785"/></marker></defs><rect width="2350" height="875" fill="#EEF0F3"/><rect x="30" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="212.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">closing speed</text><text x="212.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">v_c = −v·n̂</text><rect x="417" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="599.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">room left</text><text x="599.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">gap = d − margin</text><rect x="804" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="986.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">reaction</text><text x="986.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">d_react = v_c·Δt</text><rect x="1191" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="1373.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">braking</text><text x="1373.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">d_react</text><text x="1373.5" y="192" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">+ v_c² / 2a</text><rect x="1578" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="1760.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">turning</text><text x="1760.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">d_react</text><text x="1760.5" y="192" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">+ R(1 − sin α)</text><rect x="1965" y="30" width="365" height="200" rx="14" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="4"/><text x="2147.5" y="80" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">allowed speed</text><text x="2147.5" y="142" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">v_allow so that</text><text x="2147.5" y="192" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">d_brake = gap</text><text x="30" y="290" font-size="34" font-weight="400" fill="#55606E" text-anchor="start">Per threat, every epoch. Δt = 1.6 s, a = 2.5 m/s², R = 50 m. The most urgent threat wins: max(v_c − v_allow).</text><polygon points="70,450 300,355 530,450 300,545" fill="#FFFFFF" stroke="#6B7785" stroke-width="4"/><text x="300" y="464.0" font-size="40" font-weight="700" fill="#1F2933" text-anchor="middle">gap ≤ 0 ?</text><polygon points="640,450 900,355 1160,450 900,545" fill="#FFFFFF" stroke="#6B7785" stroke-width="4"/><text x="900" y="463.3" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">v_c ≤ v_allow ?</text><polygon points="1250,450 1500,355 1750,450 1500,545" fill="#FFFFFF" stroke="#6B7785" stroke-width="4"/><text x="1500" y="463.3" font-size="38" font-weight="700" fill="#1F2933" text-anchor="middle">gap ≥ d_turn ?</text><rect x="1850.0" y="375.0" width="420" height="150" rx="16" fill="#FBF0DC" stroke="#A35F00" stroke-width="6"/><text x="2060" y="443.1" font-size="46" font-weight="700" fill="#A35F00" text-anchor="middle">BRAKE</text><text x="2060" y="485.6" font-size="36" font-weight="400" fill="#55606E" text-anchor="middle">slow to v_allow</text><rect x="100.0" y="660.0" width="400" height="150" rx="16" fill="#F8E4E1" stroke="#B33327" stroke-width="6"/><text x="300" y="728.1" font-size="46" font-weight="700" fill="#B33327" text-anchor="middle">RETURN</text><text x="300" y="770.6" font-size="36" font-weight="400" fill="#55606E" text-anchor="middle">back off at 2 m/s</text><rect x="700.0" y="660.0" width="400" height="150" rx="16" fill="#E3F3EA" stroke="#1D7F47" stroke-width="6"/><text x="900" y="728.1" font-size="46" font-weight="700" fill="#1D7F47" text-anchor="middle">CLEAR</text><text x="900" y="770.6" font-size="36" font-weight="400" fill="#55606E" text-anchor="middle">pilot command passes</text><rect x="1300.0" y="660.0" width="400" height="150" rx="16" fill="#DEF2F3" stroke="#0B7880" stroke-width="6"/><text x="1500" y="728.1" font-size="46" font-weight="700" fill="#0B7880" text-anchor="middle">TURN</text><text x="1500" y="770.6" font-size="36" font-weight="400" fill="#55606E" text-anchor="middle">fly along the edge</text><path d="M530 450 H640" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="585" y="430" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">no</text><path d="M1160 450 H1250" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="1205" y="430" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">no</text><path d="M1750 450 H1850" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="1800" y="430" font-size="34" font-weight="400" fill="#55606E" text-anchor="middle">no</text><path d="M300 545 V660" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="316" y="585" font-size="34" font-weight="400" fill="#55606E" text-anchor="start">yes</text><path d="M900 545 V660" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="916" y="585" font-size="34" font-weight="400" fill="#55606E" text-anchor="start">yes</text><path d="M1500 545 V660" fill="none" stroke="#6B7785" stroke-width="4" marker-end="url(#a)"/><text x="1516" y="585" font-size="34" font-weight="400" fill="#55606E" text-anchor="start">yes</text><text x="1855" y="690" font-size="36" font-weight="400" fill="#1F2933" text-anchor="start">Below 15.8 m/s braking</text><text x="1855" y="738" font-size="36" font-weight="400" fill="#1F2933" text-anchor="start">is shorter; above it,</text><text x="1855" y="786" font-size="36" font-weight="400" fill="#1F2933" text-anchor="start">turning is.</text><text x="2320" y="853" font-size="34" font-weight="700" fill="#5F6B7A" text-anchor="end">DECISION · boundary.py</text></svg>